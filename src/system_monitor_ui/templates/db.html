<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speedy Double 실행 기록</title><style>
:root{--bg:#0c1114;--panel:#141c20;--line:#2a3940;--text:#edf4f6;--muted:#8da0a8;--cyan:#46d2e8;--red:#ee6268}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px ui-monospace,monospace}.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:21px;font-weight:800}.btn{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel);color:var(--text);text-decoration:none;cursor:pointer}table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px}.bad{color:var(--red)}.empty{padding:50px;text-align:center;color:var(--muted)}</style></head><body><div class="wrap"><div class="head"><div><div class="title">Speedy Double 실행 기록</div><div style="color:var(--muted)">설정과 종료 지표 비교</div></div><div><button id="clear" class="btn">전체 삭제</button> <a class="btn" href="/smu">실행 화면</a></div></div><div id="content"></div></div><script>
const f=(v,n=2)=>typeof v==='number'?v.toFixed(n):'-';async function load(){const runs=await(await fetch('/api/runs?limit=200')).json();if(!runs.length){document.getElementById('content').innerHTML='<div class="empty">저장된 실행 결과가 없습니다.</div>';return}document.getElementById('content').innerHTML=`<table><thead><tr><th>시각</th><th>상태</th><th>설정</th><th>적재/투입</th><th>시스템 takt</th><th>비전 정확도</th><th>안정성</th><th>공간효율</th><th></th></tr></thead><tbody>${runs.map(x=>{const r=x.result||{},s=x.settings||{},v=r.vision||{},st=r.stability||{},se=r.space_efficiency||{};return `<tr><td>${x.created_at}</td><td class="${x.status==='completed'?'':'bad'}">${x.status}</td><td>${s.packing_method||'-'} / ${s.placer||'-'} / seed ${s.seed??'random'}</td><td>${r.placed_boxes??'-'} / ${r.input_boxes??'-'}</td><td>${f(r.system_takt_seconds)}s</td><td>${f(v.classification_accuracy_percent,1)}%</td><td>${st.pass_count??'-'} PASS / ${st.warning_count??0} WARN</td><td>${f(se.project_efficiency_percent,1)}%</td><td><button class="btn del" data-id="${x.id}">삭제</button></td></tr>`}).join('')}</tbody></table>`;document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{await fetch('/api/runs/'+b.dataset.id,{method:'DELETE'});load()})}document.getElementById('clear').onclick=async()=>{if(confirm('모든 실행 기록을 삭제할까요?')){await fetch('/api/runs',{method:'DELETE'});load()}};load();
</script></body></html>
